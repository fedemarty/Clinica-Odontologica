<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Odontólogos - Clínica Odontológica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            min-height: 100vh;
        }
        .container-main {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-top: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .btn-custom {
            border-radius: 50px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-success">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-tooth"></i> Sonrisa Feliz - Gestión de Odontólogos
            </a>
            <a href="index.html" class="btn btn-light btn-custom">
                <i class="fas fa-home"></i> Inicio
            </a>
        </div>
    </nav>

    <div class="container container-main">
        <h2 class="text-center mb-4"><i class="fas fa-user-md"></i> Gestión de Odontólogos</h2>

        <!-- Formulario de Odontólogo -->
        <div class="card mb-4">
            <div class="card-header bg-success text-white">
                <h5><i class="fas fa-plus-circle"></i> Agregar / Editar Odontólogo</h5>
            </div>
            <div class="card-body">
                <form id="odontologoForm">
                    <input type="hidden" id="odontologoId">
                    
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Nombre *</label>
                            <input type="text" class="form-control" id="nombre" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Apellido *</label>
                            <input type="text" class="form-control" id="apellido" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Matrícula *</label>
                            <input type="text" class="form-control" id="matricula" required 
                                   placeholder="Ej: MP-12345">
                            <small class="text-muted">Número único de matrícula profesional</small>
                        </div>
                    </div>

                    <div class="text-end">
                        <button type="submit" class="btn btn-success btn-custom">
                            <i class="fas fa-save"></i> Guardar Odontólogo
                        </button>
                        <button type="button" class="btn btn-secondary btn-custom" onclick="limpiarFormulario()">
                            <i class="fas fa-times"></i> Cancelar
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabla de Odontólogos -->
        <div class="card">
            <div class="card-header bg-success text-white">
                <h5><i class="fas fa-list"></i> Lista de Odontólogos</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Apellido</th>
                                <th>Matrícula</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaOdontologos">
                            <tr>
                                <td colspan="5" class="text-center">Cargando odontólogos...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = 'http://localhost:8080/api/odontologos';

        // Cargar odontólogos al iniciar
        document.addEventListener('DOMContentLoaded', function() {
            cargarOdontologos();
        });

        // Cargar lista de odontólogos
        function cargarOdontologos() {
            fetch(API_URL)
                .then(response => response.json())
                .then(odontologos => {
                    const tbody = document.getElementById('tablaOdontologos');
                    if (odontologos.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" class="text-center">No hay odontólogos registrados</td></tr>';
                        return;
                    }
                    
                    tbody.innerHTML = odontologos.map(o => `
                        <tr>
                            <td>${o.id}</td>
                            <td>${o.nombre}</td>
                            <td>${o.apellido}</td>
                            <td><span class="badge bg-success">${o.matricula}</span></td>
                            <td>
                                <button class="btn btn-sm btn-warning" onclick="editarOdontologo(${o.id})">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-sm btn-danger" onclick="eliminarOdontologo(${o.id})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `).join('');
                })
                .catch(error => {
                    console.error('Error al cargar odontólogos:', error);
                    document.getElementById('tablaOdontologos').innerHTML = 
                        '<tr><td colspan="5" class="text-center text-danger">Error al cargar odontólogos</td></tr>';
                });
        }

        // Guardar o actualizar odontólogo
        document.getElementById('odontologoForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const odontologoId = document.getElementById('odontologoId').value;
            const odontologo = {
                nombre: document.getElementById('nombre').value,
                apellido: document.getElementById('apellido').value,
                matricula: document.getElementById('matricula').value
            };

            const url = odontologoId ? `${API_URL}/${odontologoId}` : API_URL;
            const method = odontologoId ? 'PUT' : 'POST';

            fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(odontologo)
            })
            .then(response => {
                if (response.ok) {
                    alert(odontologoId ? 'Odontólogo actualizado exitosamente' : 'Odontólogo guardado exitosamente');
                    limpiarFormulario();
                    cargarOdontologos();
                } else {
                    alert('Error al guardar el odontólogo. Verifique que la matrícula sea única.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error al comunicarse con el servidor');
            });
        });

        // Editar odontólogo
        function editarOdontologo(id) {
            fetch(`${API_URL}/${id}`)
                .then(response => response.json())
                .then(odontologo => {
                    document.getElementById('odontologoId').value = odontologo.id;
                    document.getElementById('nombre').value = odontologo.nombre;
                    document.getElementById('apellido').value = odontologo.apellido;
                    document.getElementById('matricula').value = odontologo.matricula;
                    
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                })
                .catch(error => {
                    console.error('Error al cargar odontólogo:', error);
                    alert('Error al cargar el odontólogo');
                });
        }

        // Eliminar odontólogo
        function eliminarOdontologo(id) {
            if (confirm('¿Está seguro de eliminar este odontólogo?')) {
                fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                })
                .then(response => {
                    if (response.ok) {
                        alert('Odontólogo eliminado exitosamente');
                        cargarOdontologos();
                    } else {
                        alert('Error al eliminar el odontólogo');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error al comunicarse con el servidor');
                });
            }
        }

        // Limpiar formulario
        function limpiarFormulario() {
            document.getElementById('odontologoForm').reset();
            document.getElementById('odontologoId').value = '';
        }
    </script>
</body>
</html>
