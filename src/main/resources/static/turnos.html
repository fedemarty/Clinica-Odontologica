<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Turnos - Clínica Odontológica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@300;400;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0e27;
            min-height: 100vh;
            color: #e2e8f0;
        }
        
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 280px;
            height: 100vh;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(236, 72, 153, 0.1);
            padding: 2rem;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }
        
        .logo-sidebar {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .logo-sidebar-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
        }
        
        .logo-sidebar-text h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.2rem;
            margin: 0;
            color: white;
        }
        
        .logo-sidebar-text p {
            font-size: 0.75rem;
            color: #64748b;
            margin: 0;
        }
        
        .nav-section {
            margin-bottom: 2rem;
        }
        
        .nav-section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            margin-bottom: 1rem;
            font-weight: 600;
        }
        
        .nav-link-custom {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            color: #94a3b8;
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.3s;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        
        .nav-link-custom:hover {
            background: rgba(236, 72, 153, 0.1);
            color: #ec4899;
        }
        
        .nav-link-custom.active {
            background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);
        }
        
        .nav-link-custom i {
            width: 20px;
            text-align: center;
        }
        
        .main-content {
            margin-left: 280px;
            padding: 2rem;
            min-height: 100vh;
        }
        
        .header-page {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .header-page h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            color: white;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .header-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
        }
        
        .breadcrumb-custom {
            display: flex;
            gap: 0.5rem;
            color: #64748b;
            font-size: 0.85rem;
        }
        
        .breadcrumb-custom a {
            color: #ec4899;
            text-decoration: none;
        }
        
        .card-glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
        }
        
        .card-glass-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .card-glass-header h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.3rem;
            color: white;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .form-label {
            color: #cbd5e1;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        
        .form-control, .form-select {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            transition: all 0.3s;
        }
        
        .form-control:focus, .form-select:focus {
            background: rgba(15, 23, 42, 0.8);
            border-color: #ec4899;
            box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.1);
            color: white;
        }
        
        .form-control::placeholder {
            color: #64748b;
        }
        
        .form-select option {
            background: #0f172a;
            color: white;
        }
        
        .btn-modern {
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }
        
        .btn-modern-primary {
            background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
            color: white;
        }
        
        .btn-modern-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(236, 72, 153, 0.4);
        }
        
        .btn-modern-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .btn-modern-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        
        .table-modern {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 0.5rem;
        }
        
        .table-modern thead th {
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
            padding: 1rem;
            border: none;
        }
        
        .table-modern tbody tr {
            background: rgba(255, 255, 255, 0.03);
            transition: all 0.3s;
        }
        
        .table-modern tbody tr:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: scale(1.01);
        }
        
        .table-modern tbody td {
            padding: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
        }
        
        .table-modern tbody td:first-child {
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px 0 0 10px;
        }
        
        .table-modern tbody td:last-child {
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 0 10px 10px 0;
        }
        
        .badge-modern {
            padding: 0.35rem 0.75rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        
        .badge-pink {
            background: rgba(236, 72, 153, 0.2);
            color: #ec4899;
        }
        
        .action-buttons {
            display: flex;
            gap: 0.5rem;
        }
        
        .btn-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        
        .btn-icon-edit {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
        }
        
        .btn-icon-edit:hover {
            background: #3b82f6;
            color: white;
        }
        
        .btn-icon-delete {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        
        .btn-icon-delete:hover {
            background: #ef4444;
            color: white;
        }
        
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            
            .main-content {
                margin-left: 0;
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo-sidebar">
            <div class="logo-sidebar-icon">
                <i class="fas fa-tooth"></i>
            </div>
            <div class="logo-sidebar-text">
                <h3>Sonrisa Feliz</h3>
                <p>Gestión Clínica</p>
            </div>
        </div>
        
        <nav>
            <div class="nav-section">
                <div class="nav-section-title">Navegación</div>
                <a href="index.html" class="nav-link-custom">
                    <i class="fas fa-home"></i>
                    <span>Inicio</span>
                </a>
            </div>
            
            <div class="nav-section">
                <div class="nav-section-title">Módulos</div>
                <a href="pacientes.html" class="nav-link-custom">
                    <i class="fas fa-user-injured"></i>
                    <span>Pacientes</span>
                </a>
                <a href="odontologos.html" class="nav-link-custom">
                    <i class="fas fa-user-md"></i>
                    <span>Odontólogos</span>
                </a>
                <a href="turnos.html" class="nav-link-custom active">
                    <i class="fas fa-calendar-check"></i>
                    <span>Turnos</span>
                </a>
            </div>
        </nav>
    </div>
    
    <div class="main-content">
        <div class="header-page">
            <div>
                <h1>
                    <div class="header-icon">
                        <i class="fas fa-calendar-check"></i>
                    </div>
                    Gestión de Turnos
                </h1>
                <div class="breadcrumb-custom">
                    <a href="index.html">Inicio</a>
                    <span>/</span>
                    <span>Turnos</span>
                </div>
            </div>
        </div>

        <!-- Formulario de Turno -->
        <div class="card-glass">
            <div class="card-glass-header">
                <h3>
                    <i class="fas fa-plus-circle"></i>
                    Agregar / Editar Turno
                </h3>
            </div>
            <form id="turnoForm">
                <input type="hidden" id="turnoId">
                
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Paciente *</label>
                        <select class="form-select" id="pacienteId" required>
                            <option value="">Seleccione un paciente</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Odontólogo *</label>
                        <select class="form-select" id="odontologoId" required>
                            <option value="">Seleccione un odontólogo</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Fecha y Hora *</label>
                        <input type="datetime-local" class="form-control" id="fechaHora" required>
                    </div>
                </div>

                <div class="text-end mt-4">
                    <button type="submit" class="btn-modern btn-modern-primary">
                        <i class="fas fa-save"></i> Guardar Turno
                    </button>
                    <button type="button" class="btn-modern btn-modern-secondary" onclick="limpiarFormulario()">
                        <i class="fas fa-times"></i> Cancelar
                    </button>
                </div>
            </form>
        </div>

        <!-- Tabla de Turnos -->
        <div class="card-glass">
            <div class="card-glass-header">
                <h3>
                    <i class="fas fa-list"></i>
                    Lista de Turnos
                </h3>
            </div>
            <div class="table-responsive">
                <table class="table-modern">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Paciente</th>
                            <th>Odontólogo</th>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaTurnos">
                        <tr>
                            <td colspan="6" style="text-align: center; color: #64748b;">
                                <i class="fas fa-spinner fa-spin"></i> Cargando turnos...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = 'http://localhost:8080/api/turnos';
        const PACIENTES_URL = 'http://localhost:8080/api/pacientes';
        const ODONTOLOGOS_URL = 'http://localhost:8080/api/odontologos';

        // Cargar datos al iniciar
        document.addEventListener('DOMContentLoaded', function() {
            cargarPacientes();
            cargarOdontologos();
            cargarTurnos();
        });

        // Cargar pacientes en el select
        function cargarPacientes() {
            fetch(PACIENTES_URL)
                .then(response => response.json())
                .then(pacientes => {
                    const select = document.getElementById('pacienteId');
                    select.innerHTML = '<option value="">Seleccione un paciente</option>';
                    pacientes.forEach(p => {
                        select.innerHTML += `<option value="${p.id}">${p.nombre} ${p.apellido} - ${p.email}</option>`;
                    });
                })
                .catch(error => console.error('Error al cargar pacientes:', error));
        }

        // Cargar odontólogos en el select
        function cargarOdontologos() {
            fetch(ODONTOLOGOS_URL)
                .then(response => response.json())
                .then(odontologos => {
                    const select = document.getElementById('odontologoId');
                    select.innerHTML = '<option value="">Seleccione un odontólogo</option>';
                    odontologos.forEach(o => {
                        select.innerHTML += `<option value="${o.id}">Dr/a. ${o.nombre} ${o.apellido} - ${o.matricula}</option>`;
                    });
                })
                .catch(error => console.error('Error al cargar odontólogos:', error));
        }

        // Cargar lista de turnos
        function cargarTurnos() {
            fetch(API_URL)
                .then(response => response.json())
                .then(turnos => {
                    const tbody = document.getElementById('tablaTurnos');
                    if (turnos.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #64748b;">No hay turnos registrados</td></tr>';
                        return;
                    }
                    
                    tbody.innerHTML = turnos.map(t => {
                        const fecha = new Date(t.fechaHora);
                        const fechaStr = fecha.toLocaleDateString('es-AR');
                        const horaStr = fecha.toLocaleTimeString('es-AR', {hour: '2-digit', minute:'2-digit'});
                        
                        return `
                        <tr>
                            <td><span class="badge-modern badge-pink">${t.id}</span></td>
                            <td><i class="fas fa-user-injured" style="color: #38bdf8; margin-right: 0.5rem;"></i>${t.paciente ? t.paciente.nombre + ' ' + t.paciente.apellido : 'N/A'}</td>
                            <td><i class="fas fa-user-md" style="color: #a855f7; margin-right: 0.5rem;"></i>Dr/a. ${t.odontologo ? t.odontologo.nombre + ' ' + t.odontologo.apellido : 'N/A'}</td>
                            <td><i class="fas fa-calendar" style="color: #64748b; margin-right: 0.5rem;"></i>${fechaStr}</td>
                            <td><i class="fas fa-clock" style="color: #ec4899; margin-right: 0.5rem;"></i>${horaStr}</td>
                            <td>
                                <div class="action-buttons">
                                    <button class="btn-icon btn-icon-edit" onclick="editarTurno(${t.id})" title="Editar">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button class="btn-icon btn-icon-delete" onclick="eliminarTurno(${t.id})" title="Eliminar">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        `;
                    }).join('');
                })
                .catch(error => {
                    console.error('Error al cargar turnos:', error);
                    document.getElementById('tablaTurnos').innerHTML = 
                        '<tr><td colspan="6" class="text-center text-danger">Error al cargar turnos</td></tr>';
                });
        }

        // Guardar o actualizar turno
        document.getElementById('turnoForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const turnoId = document.getElementById('turnoId').value;
            const pacienteId = document.getElementById('pacienteId').value;
            const odontologoId = document.getElementById('odontologoId').value;
            const fechaHora = document.getElementById('fechaHora').value;

            // Convertir datetime-local a formato ISO para el backend
            const fechaHoraISO = new Date(fechaHora).toISOString();

            const turno = {
                paciente: { id: parseInt(pacienteId) },
                odontologo: { id: parseInt(odontologoId) },
                fechaHora: fechaHoraISO.substring(0, 19) // Formato: yyyy-MM-ddTHH:mm:ss
            };

            const url = turnoId ? `${API_URL}/${turnoId}` : API_URL;
            const method = turnoId ? 'PUT' : 'POST';

            fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(turno)
            })
            .then(response => {
                if (response.ok) {
                    alert(turnoId ? 'Turno actualizado exitosamente' : 'Turno guardado exitosamente');
                    limpiarFormulario();
                    cargarTurnos();
                } else {
                    alert('Error al guardar el turno');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error al comunicarse con el servidor');
            });
        });

        // Editar turno
        function editarTurno(id) {
            fetch(`${API_URL}/${id}`)
                .then(response => response.json())
                .then(turno => {
                    document.getElementById('turnoId').value = turno.id;
                    document.getElementById('pacienteId').value = turno.paciente.id;
                    document.getElementById('odontologoId').value = turno.odontologo.id;
                    
                    // Convertir fecha del servidor a formato datetime-local
                    const fecha = new Date(turno.fechaHora);
                    const año = fecha.getFullYear();
                    const mes = String(fecha.getMonth() + 1).padStart(2, '0');
                    const dia = String(fecha.getDate()).padStart(2, '0');
                    const hora = String(fecha.getHours()).padStart(2, '0');
                    const minuto = String(fecha.getMinutes()).padStart(2, '0');
                    
                    document.getElementById('fechaHora').value = `${año}-${mes}-${dia}T${hora}:${minuto}`;
                    
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                })
                .catch(error => {
                    console.error('Error al cargar turno:', error);
                    alert('Error al cargar el turno');
                });
        }

        // Eliminar turno
        function eliminarTurno(id) {
            if (confirm('¿Está seguro de eliminar este turno?')) {
                fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                })
                .then(response => {
                    if (response.ok) {
                        alert('Turno eliminado exitosamente');
                        cargarTurnos();
                    } else {
                        alert('Error al eliminar el turno');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error al comunicarse con el servidor');
                });
            }
        }

        // Limpiar formulario
        function limpiarFormulario() {
            document.getElementById('turnoForm').reset();
            document.getElementById('turnoId').value = '';
        }
    </script>
</body>
</html>
