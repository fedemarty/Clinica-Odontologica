<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pacientes - Clínica Odontológica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@300;400;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0e27;
            min-height: 100vh;
            color: #e2e8f0;
        }
        
        /* Navbar lateral fija */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 280px;
            height: 100vh;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(56, 189, 248, 0.1);
            padding: 2rem;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }
        
        .logo-sidebar {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .logo-sidebar-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #38bdf8 0%, #0ea5e9 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
        }
        
        .logo-sidebar-text h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.2rem;
            margin: 0;
            color: white;
        }
        
        .logo-sidebar-text p {
            font-size: 0.75rem;
            color: #64748b;
            margin: 0;
        }
        
        .nav-section {
            margin-bottom: 2rem;
        }
        
        .nav-section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            margin-bottom: 1rem;
            font-weight: 600;
        }
        
        .nav-link-custom {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            color: #94a3b8;
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.3s;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        
        .nav-link-custom:hover {
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
        }
        
        .nav-link-custom.active {
            background: linear-gradient(135deg, #38bdf8 0%, #0ea5e9 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }
        
        .nav-link-custom i {
            width: 20px;
            text-align: center;
        }
        
        /* Contenido principal */
        .main-content {
            margin-left: 280px;
            padding: 2rem;
            min-height: 100vh;
        }
        
        .header-page {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .header-page h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            color: white;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .header-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #38bdf8 0%, #0ea5e9 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
        }
        
        .breadcrumb-custom {
            display: flex;
            gap: 0.5rem;
            color: #64748b;
            font-size: 0.85rem;
        }
        
        .breadcrumb-custom a {
            color: #38bdf8;
            text-decoration: none;
        }
        
        /* Cards con glassmorphism */
        .card-glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
        }
        
        .card-glass-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .card-glass-header h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.3rem;
            color: white;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .form-label {
            color: #cbd5e1;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        
        .form-control, .form-select {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            transition: all 0.3s;
        }
        
        .form-control:focus, .form-select:focus {
            background: rgba(15, 23, 42, 0.8);
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1);
            color: white;
        }
        
        .form-control::placeholder {
            color: #64748b;
        }
        
        /* Botones modernos */
        .btn-modern {
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }
        
        .btn-modern-primary {
            background: linear-gradient(135deg, #38bdf8 0%, #0ea5e9 100%);
            color: white;
        }
        
        .btn-modern-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.4);
        }
        
        .btn-modern-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .btn-modern-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        
        .btn-modern-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }
        
        .btn-modern-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }
        
        /* Tabla moderna */
        .table-modern {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 0.5rem;
        }
        
        .table-modern thead th {
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
            padding: 1rem;
            border: none;
        }
        
        .table-modern tbody tr {
            background: rgba(255, 255, 255, 0.03);
            transition: all 0.3s;
        }
        
        .table-modern tbody tr:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: scale(1.01);
        }
        
        .table-modern tbody td {
            padding: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
        }
        
        .table-modern tbody td:first-child {
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px 0 0 10px;
        }
        
        .table-modern tbody td:last-child {
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 0 10px 10px 0;
        }
        
        .badge-modern {
            padding: 0.35rem 0.75rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        
        .badge-success {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }
        
        .action-buttons {
            display: flex;
            gap: 0.5rem;
        }
        
        .btn-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        
        .btn-icon-edit {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
        }
        
        .btn-icon-edit:hover {
            background: #3b82f6;
            color: white;
        }
        
        .btn-icon-delete {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        
        .btn-icon-delete:hover {
            background: #ef4444;
            color: white;
        }
        
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            
            .main-content {
                margin-left: 0;
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo-sidebar">
            <div class="logo-sidebar-icon">
                <i class="fas fa-tooth"></i>
            </div>
            <div class="logo-sidebar-text">
                <h3>Sonrisa Feliz</h3>
                <p>Gestión Clínica</p>
            </div>
        </div>
        
        <nav>
            <div class="nav-section">
                <div class="nav-section-title">Navegación</div>
                <a href="index.html" class="nav-link-custom">
                    <i class="fas fa-home"></i>
                    <span>Inicio</span>
                </a>
            </div>
            
            <div class="nav-section">
                <div class="nav-section-title">Módulos</div>
                <a href="pacientes.html" class="nav-link-custom active">
                    <i class="fas fa-user-injured"></i>
                    <span>Pacientes</span>
                </a>
                <a href="odontologos.html" class="nav-link-custom">
                    <i class="fas fa-user-md"></i>
                    <span>Odontólogos</span>
                </a>
                <a href="turnos.html" class="nav-link-custom">
                    <i class="fas fa-calendar-check"></i>
                    <span>Turnos</span>
                </a>
            </div>
        </nav>
    </div>
    
    <!-- Contenido Principal -->
    <div class="main-content">
        <div class="header-page">
            <div>
                <h1>
                    <div class="header-icon">
                        <i class="fas fa-user-injured"></i>
                    </div>
                    Gestión de Pacientes
                </h1>
                <div class="breadcrumb-custom">
                    <a href="index.html">Inicio</a>
                    <span>/</span>
                    <span>Pacientes</span>
                </div>
            </div>
        </div>

        <!-- Formulario de Paciente -->
        <div class="card-glass">
            <div class="card-glass-header">
                <h3>
                    <i class="fas fa-plus-circle"></i>
                    Agregar / Editar Paciente
                </h3>
            </div>
            <form id="pacienteForm">
                <input type="hidden" id="pacienteId">
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nombre *</label>
                        <input type="text" class="form-control" id="nombre" required placeholder="Ingrese nombre">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Apellido *</label>
                        <input type="text" class="form-control" id="apellido" required placeholder="Ingrese apellido">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email *</label>
                        <input type="email" class="form-control" id="email" required placeholder="ejemplo@correo.com">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Número de Contacto</label>
                        <input type="text" class="form-control" id="numeroContacto" placeholder="+54 11 1234-5678">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Fecha de Ingreso *</label>
                        <input type="date" class="form-control" id="fechaIngreso" required>
                    </div>
                </div>

                <h6 class="mt-4 mb-3" style="color: #94a3b8; font-size: 0.95rem;">
                    <i class="fas fa-home"></i> Información de Domicilio
                </h6>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Calle</label>
                        <input type="text" class="form-control" id="domicilioCalle" placeholder="Nombre de calle">
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Número</label>
                        <input type="number" class="form-control" id="domicilioNumero" placeholder="Nº">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Localidad</label>
                        <input type="text" class="form-control" id="domicilioLocalidad" placeholder="Ciudad">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Provincia</label>
                        <input type="text" class="form-control" id="domicilioProvincia" placeholder="Provincia">
                        </div>
                    </div>

                    <div class="text-end mt-4">
                        <button type="submit" class="btn-modern btn-modern-primary">
                            <i class="fas fa-save"></i> Guardar Paciente
                        </button>
                        <button type="button" class="btn-modern btn-modern-secondary" onclick="limpiarFormulario()">
                            <i class="fas fa-times"></i> Cancelar
                        </button>
                    </div>
                </form>
        </div>

        <!-- Tabla de Pacientes -->
        <div class="card-glass">
            <div class="card-glass-header">
                <h3>
                    <i class="fas fa-list"></i>
                    Lista de Pacientes
                </h3>
            </div>
            <div class="table-responsive">
                <table class="table-modern">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Email</th>
                            <th>Contacto</th>
                            <th>Ingreso</th>
                            <th>Domicilio</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaPacientes">
                        <tr>
                            <td colspan="8" style="text-align: center; color: #64748b;">
                                <i class="fas fa-spinner fa-spin"></i> Cargando pacientes...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = 'http://localhost:8080/api/pacientes';

        // Cargar pacientes al iniciar
        document.addEventListener('DOMContentLoaded', function() {
            cargarPacientes();
            // Establecer fecha actual como predeterminada
            document.getElementById('fechaIngreso').valueAsDate = new Date();
        });

        // Cargar lista de pacientes
        function cargarPacientes() {
            fetch(API_URL)
                .then(response => response.json())
                .then(pacientes => {
                    const tbody = document.getElementById('tablaPacientes');
                    if (pacientes.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="8" class="text-center">No hay pacientes registrados</td></tr>';
                        return;
                    }
                    
                    tbody.innerHTML = pacientes.map(p => `
                        <tr>
                            <td><span class="badge-modern badge-success">${p.id}</span></td>
                            <td>${p.nombre}</td>
                            <td>${p.apellido}</td>
                            <td><i class="fas fa-envelope" style="color: #64748b; margin-right: 0.5rem;"></i>${p.email}</td>
                            <td>${p.numeroContacto || '<span style="color: #64748b;">Sin contacto</span>'}</td>
                            <td>${p.fechaIngreso}</td>
                            <td>${p.domicilio ? `${p.domicilio.calle} ${p.domicilio.numero}, ${p.domicilio.localidad}` : '<span style="color: #64748b;">Sin domicilio</span>'}</td>
                            <td>
                                <div class="action-buttons">
                                    <button class="btn-icon btn-icon-edit" onclick="editarPaciente(${p.id})" title="Editar">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button class="btn-icon btn-icon-delete" onclick="eliminarPaciente(${p.id})" title="Eliminar">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `).join('');
                })
                .catch(error => {
                    console.error('Error al cargar pacientes:', error);
                    document.getElementById('tablaPacientes').innerHTML = 
                        '<tr><td colspan="8" class="text-center text-danger">Error al cargar pacientes</td></tr>';
                });
        }

        // Guardar o actualizar paciente
        document.getElementById('pacienteForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const pacienteId = document.getElementById('pacienteId').value;
            
            // Capturar valores del domicilio
            const calleDom = document.getElementById('domicilioCalle').value.trim();
            const numeroDom = document.getElementById('domicilioNumero').value.trim();
            const localidadDom = document.getElementById('domicilioLocalidad').value.trim();
            const provinciaDom = document.getElementById('domicilioProvincia').value.trim();
            
            // Validar domicilio: o todos los campos completos o ninguno
            let domicilio = null;
            const algunCampoCompleto = calleDom || numeroDom || localidadDom || provinciaDom;
            
            if (algunCampoCompleto) {
                // Si hay algún campo, validar que estén TODOS completos
                if (!calleDom || !numeroDom || !localidadDom || !provinciaDom) {
                    alert('Si ingresa información de domicilio, debe completar todos los campos: Calle, Número, Localidad y Provincia');
                    return;
                }
                domicilio = {
                    calle: calleDom,
                    numero: parseInt(numeroDom),
                    localidad: localidadDom,
                    provincia: provinciaDom
                };
            }

            const paciente = {
                nombre: document.getElementById('nombre').value,
                apellido: document.getElementById('apellido').value,
                email: document.getElementById('email').value,
                numeroContacto: document.getElementById('numeroContacto').value || null,
                fechaIngreso: document.getElementById('fechaIngreso').value,
                domicilio: domicilio
            };

            const url = pacienteId ? `${API_URL}/${pacienteId}` : API_URL;
            const method = pacienteId ? 'PUT' : 'POST';

            fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(paciente)
            })
            .then(response => {
                if (response.ok) {
                    return response.json().then(data => {
                        alert(pacienteId ? 'Paciente actualizado exitosamente' : 'Paciente guardado exitosamente');
                        limpiarFormulario();
                        cargarPacientes();
                    });
                } else if (response.status === 400) {
                    alert('Error: Ya existe un paciente con ese email o los datos son inválidos');
                } else {
                    alert('Error al guardar el paciente. Por favor, intente nuevamente.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error al comunicarse con el servidor');
            });
        });

        // Editar paciente
        function editarPaciente(id) {
            fetch(`${API_URL}/${id}`)
                .then(response => response.json())
                .then(paciente => {
                    document.getElementById('pacienteId').value = paciente.id;
                    document.getElementById('nombre').value = paciente.nombre;
                    document.getElementById('apellido').value = paciente.apellido;
                    document.getElementById('email').value = paciente.email;
                    document.getElementById('numeroContacto').value = paciente.numeroContacto || '';
                    document.getElementById('fechaIngreso').value = paciente.fechaIngreso;
                    
                    if (paciente.domicilio) {
                        document.getElementById('domicilioCalle').value = paciente.domicilio.calle || '';
                        document.getElementById('domicilioNumero').value = paciente.domicilio.numero || '';
                        document.getElementById('domicilioLocalidad').value = paciente.domicilio.localidad || '';
                        document.getElementById('domicilioProvincia').value = paciente.domicilio.provincia || '';
                    }
                    
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                })
                .catch(error => {
                    console.error('Error al cargar paciente:', error);
                    alert('Error al cargar el paciente');
                });
        }

        // Eliminar paciente
        function eliminarPaciente(id) {
            if (confirm('¿Está seguro de eliminar este paciente?')) {
                fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                })
                .then(response => {
                    if (response.ok) {
                        alert('Paciente eliminado exitosamente');
                        cargarPacientes();
                    } else {
                        alert('Error al eliminar el paciente');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error al comunicarse con el servidor');
                });
            }
        }

        // Limpiar formulario
        function limpiarFormulario() {
            document.getElementById('pacienteForm').reset();
            document.getElementById('pacienteId').value = '';
            document.getElementById('fechaIngreso').valueAsDate = new Date();
        }
    </script>
</body>
</html>
