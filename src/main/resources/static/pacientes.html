<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pacientes - Clínica Odontológica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container-main {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-top: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .btn-custom {
            border-radius: 50px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-tooth"></i> Sonrisa Feliz - Gestión de Pacientes
            </a>
            <a href="index.html" class="btn btn-light btn-custom">
                <i class="fas fa-home"></i> Inicio
            </a>
        </div>
    </nav>

    <div class="container container-main">
        <h2 class="text-center mb-4"><i class="fas fa-user-injured"></i> Gestión de Pacientes</h2>

        <!-- Formulario de Paciente -->
        <div class="card mb-4">
            <div class="card-header bg-primary text-white">
                <h5><i class="fas fa-plus-circle"></i> Agregar / Editar Paciente</h5>
            </div>
            <div class="card-body">
                <form id="pacienteForm">
                    <input type="hidden" id="pacienteId">
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Nombre *</label>
                            <input type="text" class="form-control" id="nombre" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Apellido *</label>
                            <input type="text" class="form-control" id="apellido" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email *</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Número de Contacto</label>
                            <input type="text" class="form-control" id="numeroContacto">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Fecha de Ingreso *</label>
                            <input type="date" class="form-control" id="fechaIngreso" required>
                        </div>
                    </div>

                    <h6 class="mt-4 mb-3">Domicilio</h6>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Calle</label>
                            <input type="text" class="form-control" id="domicilioCalle">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Número</label>
                            <input type="number" class="form-control" id="domicilioNumero">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Localidad</label>
                            <input type="text" class="form-control" id="domicilioLocalidad">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Provincia</label>
                            <input type="text" class="form-control" id="domicilioProvincia">
                        </div>
                    </div>

                    <div class="text-end">
                        <button type="submit" class="btn btn-primary btn-custom">
                            <i class="fas fa-save"></i> Guardar Paciente
                        </button>
                        <button type="button" class="btn btn-secondary btn-custom" onclick="limpiarFormulario()">
                            <i class="fas fa-times"></i> Cancelar
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabla de Pacientes -->
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5><i class="fas fa-list"></i> Lista de Pacientes</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Apellido</th>
                                <th>Email</th>
                                <th>Contacto</th>
                                <th>Fecha Ingreso</th>
                                <th>Domicilio</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaPacientes">
                            <tr>
                                <td colspan="8" class="text-center">Cargando pacientes...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = 'http://localhost:8080/api/pacientes';

        // Cargar pacientes al iniciar
        document.addEventListener('DOMContentLoaded', function() {
            cargarPacientes();
            // Establecer fecha actual como predeterminada
            document.getElementById('fechaIngreso').valueAsDate = new Date();
        });

        // Cargar lista de pacientes
        function cargarPacientes() {
            fetch(API_URL)
                .then(response => response.json())
                .then(pacientes => {
                    const tbody = document.getElementById('tablaPacientes');
                    if (pacientes.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="8" class="text-center">No hay pacientes registrados</td></tr>';
                        return;
                    }
                    
                    tbody.innerHTML = pacientes.map(p => `
                        <tr>
                            <td>${p.id}</td>
                            <td>${p.nombre}</td>
                            <td>${p.apellido}</td>
                            <td>${p.email}</td>
                            <td>${p.numeroContacto || 'N/A'}</td>
                            <td>${p.fechaIngreso}</td>
                            <td>${p.domicilio ? `${p.domicilio.calle} ${p.domicilio.numero}, ${p.domicilio.localidad}` : 'N/A'}</td>
                            <td>
                                <button class="btn btn-sm btn-warning" onclick="editarPaciente(${p.id})">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-sm btn-danger" onclick="eliminarPaciente(${p.id})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `).join('');
                })
                .catch(error => {
                    console.error('Error al cargar pacientes:', error);
                    document.getElementById('tablaPacientes').innerHTML = 
                        '<tr><td colspan="8" class="text-center text-danger">Error al cargar pacientes</td></tr>';
                });
        }

        // Guardar o actualizar paciente
        document.getElementById('pacienteForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const pacienteId = document.getElementById('pacienteId').value;
            const domicilio = {
                calle: document.getElementById('domicilioCalle').value || null,
                numero: document.getElementById('domicilioNumero').value ? parseInt(document.getElementById('domicilioNumero').value) : null,
                localidad: document.getElementById('domicilioLocalidad').value || null,
                provincia: document.getElementById('domicilioProvincia').value || null
            };

            const paciente = {
                nombre: document.getElementById('nombre').value,
                apellido: document.getElementById('apellido').value,
                email: document.getElementById('email').value,
                numeroContacto: document.getElementById('numeroContacto').value || null,
                fechaIngreso: document.getElementById('fechaIngreso').value,
                domicilio: (domicilio.calle || domicilio.numero) ? domicilio : null
            };

            const url = pacienteId ? `${API_URL}/${pacienteId}` : API_URL;
            const method = pacienteId ? 'PUT' : 'POST';

            fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(paciente)
            })
            .then(response => {
                if (response.ok) {
                    alert(pacienteId ? 'Paciente actualizado exitosamente' : 'Paciente guardado exitosamente');
                    limpiarFormulario();
                    cargarPacientes();
                } else {
                    alert('Error al guardar el paciente');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error al comunicarse con el servidor');
            });
        });

        // Editar paciente
        function editarPaciente(id) {
            fetch(`${API_URL}/${id}`)
                .then(response => response.json())
                .then(paciente => {
                    document.getElementById('pacienteId').value = paciente.id;
                    document.getElementById('nombre').value = paciente.nombre;
                    document.getElementById('apellido').value = paciente.apellido;
                    document.getElementById('email').value = paciente.email;
                    document.getElementById('numeroContacto').value = paciente.numeroContacto || '';
                    document.getElementById('fechaIngreso').value = paciente.fechaIngreso;
                    
                    if (paciente.domicilio) {
                        document.getElementById('domicilioCalle').value = paciente.domicilio.calle || '';
                        document.getElementById('domicilioNumero').value = paciente.domicilio.numero || '';
                        document.getElementById('domicilioLocalidad').value = paciente.domicilio.localidad || '';
                        document.getElementById('domicilioProvincia').value = paciente.domicilio.provincia || '';
                    }
                    
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                })
                .catch(error => {
                    console.error('Error al cargar paciente:', error);
                    alert('Error al cargar el paciente');
                });
        }

        // Eliminar paciente
        function eliminarPaciente(id) {
            if (confirm('¿Está seguro de eliminar este paciente?')) {
                fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                })
                .then(response => {
                    if (response.ok) {
                        alert('Paciente eliminado exitosamente');
                        cargarPacientes();
                    } else {
                        alert('Error al eliminar el paciente');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error al comunicarse con el servidor');
                });
            }
        }

        // Limpiar formulario
        function limpiarFormulario() {
            document.getElementById('pacienteForm').reset();
            document.getElementById('pacienteId').value = '';
            document.getElementById('fechaIngreso').valueAsDate = new Date();
        }
    </script>
</body>
</html>
