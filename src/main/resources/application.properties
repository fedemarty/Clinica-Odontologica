# ===============================================
# Clínica Odontológica - Configuración Spring Boot
# ===============================================

# Información de la aplicación
spring.application.name=clinica-odontologica

# ===============================================
# Configuración H2 Database 
# ===============================================
# Mantener compatibilidad con BD existente ~/clinicaFeliz
spring.datasource.url=jdbc:h2:~/clinicaFeliz
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console habilitada para desarrollo
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===============================================
# Configuración JPA/Hibernate
# ===============================================
# Mostrar consultas SQL (para aprendizaje)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Estrategia de DDL: create-drop resetea datos en cada ejecución
# (similar al patrón BD.crearTablas() anterior)
spring.jpa.hibernate.ddl-auto=create-drop

# Dialecto H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ===============================================
# Configuración de Logging
# ===============================================
# Log4j según requerimiento de la consigna
logging.level.com.clinicaodontologica=INFO
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%level] %logger{36} - %msg%n

# ===============================================
# Configuración del servidor
# ===============================================
server.port=8080